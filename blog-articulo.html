<!-- ANIMACION BOTON WHATSAPP -->
 <script>
const btn = document.getElementById("btnWhatsapp");
const contenedor = document.querySelector(".whatsapp-float");

btn.addEventListener("click", () => {
    contenedor.classList.toggle("activo");
});
</script>

<!-- EVITA QUE EL BOTON DE WHATSAPP INGRESE AL FOOTER-->
 <script>
window.addEventListener('scroll', function() {
    const whatsappBtn = document.querySelector('.whatsapp-float');
    const footer = document.querySelector('.footer');
    
    // Calculamos la posición del footer respecto a la pantalla
    const footerRect = footer.getBoundingClientRect();
    const windowHeight = window.innerHeight;

    // Si el borde superior del footer entra en la pantalla
    if (footerRect.top < windowHeight) {
        // Calculamos cuánto espacio ocupa el footer en pantalla
        const desplazamiento = windowHeight - footerRect.top + 20; 
        whatsappBtn.style.bottom = desplazamiento + 'px';
    } else {
        // Posición original cuando no hay footer visible
        whatsappBtn.style.bottom = '20px';
    }
});
</script>
